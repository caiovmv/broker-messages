apiVersion: v1
kind: Secret
metadata:
  name: broker
type: Opaque
stringData:
  Database__ConnectionString: {{ .Values.segredo.banco | quote }}
  Caching__ConnectionString: {{ .Values.segredo.cache | quote }}
  Broker__OperadorSenha: {{ .Values.segredo.operadorSenha | quote }}
  Broker__WebhookSegredo: {{ .Values.segredo.webhook | quote }}
  Smtp__SenhaDoCertificado: {{ .Values.segredo.smtpSenha | quote }}
