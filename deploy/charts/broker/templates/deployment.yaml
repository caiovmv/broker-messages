apiVersion: apps/v1
kind: Deployment
metadata:
  name: broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broker
  template:
    metadata:
      labels:
        app: broker
    spec:
      containers:
        - name: api
          image: {{ .Values.imagem | quote }}
          imagePullPolicy: {{ .Values.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: 8080
            - name: smtp
              containerPort: 587
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: Database__Provider
              value: PostgreSQL
            - name: Caching__Provider
              value: Valkey
            - name: Workflows__Endpoint
              value: temporal-frontend:7233
            - name: Workflows__Namespace
              value: default
            - name: Workflows__Queue
              value: broker
            - name: Broker__HostSmtp
              value: {{ .Values.hostSmtp | quote }}
            - name: Broker__PortaSmtp
              value: {{ .Values.portaSmtp | quote }}
            - name: Broker__OperadorUsuario
              value: {{ .Values.operadorUsuario | quote }}
            - name: Smtp__Escutar
              value: "true"
            - name: Smtp__Porta
              value: "587"
            - name: Smtp__Certificado
              value: {{ .Values.smtpCertificado | quote }}
            - name: Broker__PastaDeChaves
              value: /var/broker/chaves
          envFrom:
            - secretRef:
                name: broker
          volumeMounts:
            - name: chaves
              mountPath: /var/broker/chaves
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
      volumes:
        - name: chaves
          persistentVolumeClaim:
            claimName: broker-chaves
